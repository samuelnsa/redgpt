<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SuperNS - L'Araignée AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    
    <!-- Main Container -->
    <div class="app-container">
        
        <!-- Sidebar -->
        <aside class="sidebar">
            <!-- Logo -->
            <div class="logo-container">
                <div class="logo">
                    <svg viewBox="0 0 200 200" class="logo-svg">
                        <defs>
                            <linearGradient id="spider-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#00ff88;stop-opacity:1" />
                                <stop offset="100%" style="stop-color:#00d4ff;stop-opacity:1" />
                            </linearGradient>
                        </defs>
                        <!-- Spider body -->
                        <circle cx="100" cy="100" r="25" fill="url(#spider-gradient)" opacity="0.9"/>
                        <!-- Spider legs -->
                        <path d="M 75 90 Q 40 70, 20 60" stroke="url(#spider-gradient)" stroke-width="3" fill="none" opacity="0.7"/>
                        <path d="M 75 100 Q 30 100, 10 100" stroke="url(#spider-gradient)" stroke-width="3" fill="none" opacity="0.7"/>
                        <path d="M 75 110 Q 40 130, 20 140" stroke="url(#spider-gradient)" stroke-width="3" fill="none" opacity="0.7"/>
                        <path d="M 125 90 Q 160 70, 180 60" stroke="url(#spider-gradient)" stroke-width="3" fill="none" opacity="0.7"/>
                        <path d="M 125 100 Q 170 100, 190 100" stroke="url(#spider-gradient)" stroke-width="3" fill="none" opacity="0.7"/>
                        <path d="M 125 110 Q 160 130, 180 140" stroke="url(#spider-gradient)" stroke-width="3" fill="none" opacity="0.7"/>
                        <!-- Glow effect -->
                        <circle cx="100" cy="100" r="30" fill="url(#spider-gradient)" opacity="0.2"/>
                    </svg>
                    <span class="logo-text">SuperNS</span>
                </div>
                <p class="logo-subtitle">by L'Araignée</p>
            </div>
            
            <!-- Action Buttons -->
            <div class="sidebar-actions">
                <button class="btn-icon" onclick="newChat()" title="Nouvelle conversation">
                    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                    </svg>
                </button>
                
                <button class="btn-icon" onclick="document.getElementById('fileInput').click()" title="Attacher fichiers">
                    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13"/>
                    </svg>
                </button>
                
                <button class="btn-icon" onclick="toggleSettings()" title="Paramètres">
                    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                    </svg>
                </button>
            </div>
            
            <!-- Conversations History -->
            <div class="conversations-list" id="conversationsList">
                <!-- Conversations will be added here -->
            </div>
        </aside>
        
        <!-- Main Chat Area -->
        <main class="chat-area">
            
            <!-- Messages Container -->
            <div class="messages-container" id="messagesContainer">
                <div id="messages" class="messages">
                    <!-- Welcome message -->
                    <div class="welcome-message" id="welcomeMessage">
                        <div class="welcome-icon">
                            <svg viewBox="0 0 200 200" class="welcome-svg">
                                <defs>
                                    <linearGradient id="welcome-gradient">
                                        <stop offset="0%" stop-color="#00ff88"/>
                                        <stop offset="100%" stop-color="#00d4ff"/>
                                    </linearGradient>
                                </defs>
                                <circle cx="100" cy="100" r="25" fill="url(#welcome-gradient)" opacity="0.9"/>
                                <path d="M 75 90 Q 40 70, 20 60" stroke="url(#welcome-gradient)" stroke-width="3" fill="none" opacity="0.7"/>
                                <path d="M 75 100 Q 30 100, 10 100" stroke="url(#welcome-gradient)" stroke-width="3" fill="none" opacity="0.7"/>
                                <path d="M 75 110 Q 40 130, 20 140" stroke="url(#welcome-gradient)" stroke-width="3" fill="none" opacity="0.7"/>
                                <path d="M 125 90 Q 160 70, 180 60" stroke="url(#welcome-gradient)" stroke-width="3" fill="none" opacity="0.7"/>
                                <path d="M 125 100 Q 170 100, 190 100" stroke="url(#welcome-gradient)" stroke-width="3" fill="none" opacity="0.7"/>
                                <path d="M 125 110 Q 160 130, 180 140" stroke="url(#welcome-gradient)" stroke-width="3" fill="none" opacity="0.7"/>
                                <circle cx="100" cy="100" r="35" fill="url(#welcome-gradient)" opacity="0.1"/>
                            </svg>
                        </div>
                        <h1 class="welcome-title">SuperNS Intelligence</h1>
                        <p class="welcome-subtitle">Assistant IA sans restrictions • Développé par L'Araignée</p>
                    </div>
                </div>
            </div>
            
            <!-- Input Area -->
            <div class="input-area">
                <!-- Attached Files Preview -->
                <div id="attachedFilesPreview" class="attached-files-preview hidden"></div>
                
                <!-- Input Container -->
                <div class="input-container">
                    <textarea 
                        id="messageInput"
                        placeholder="Posez votre question..."
                        rows="1"
                        oninput="autoResize(this)"
                        onkeydown="handleKeyDown(event)"
                    ></textarea>
                    
                    <button id="sendButton" onclick="sendMessage()" class="btn-send" disabled>
                        <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 10l7-7m0 0l7 7m-7-7v18"/>
                        </svg>
                    </button>
                </div>
            </div>
            
        </main>
    </div>

    <!-- Settings Modal -->
    <div id="settingsModal" class="modal hidden">
        <div class="modal-overlay" onclick="toggleSettings()"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h2>Paramètres</h2>
                <button onclick="toggleSettings()" class="btn-close">
                    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Clé API DeepSeek</label>
                    <input type="password" id="apiKeyInput" placeholder="sk-..." class="input-field">
                    <p class="help-text">Obtenez votre clé sur <a href="https://platform.deepseek.com/" target="_blank">platform.deepseek.com</a></p>
                </div>
                <button onclick="saveSettings()" class="btn-primary">Enregistrer</button>
            </div>
        </div>
    </div>

    <!-- Hidden File Input -->
    <input type="file" id="fileInput" multiple class="hidden" onchange="handleFileSelect(event)">

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
