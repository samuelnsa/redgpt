<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <!-- Background -->
  <rect width="500" height="500" fill="#0a0a0a"/>
  
  <!-- Spider Web -->
  <circle cx="250" cy="250" r="200" fill="none" stroke="#ff0000" stroke-width="1" opacity="0.2"/>
  <circle cx="250" cy="250" r="150" fill="none" stroke="#ff0000" stroke-width="1" opacity="0.3"/>
  <circle cx="250" cy="250" r="100" fill="none" stroke="#ff0000" stroke-width="1" opacity="0.4"/>
  
  <!-- Web lines -->
  <line x1="250" y1="50" x2="250" y2="450" stroke="#ff0000" stroke-width="1" opacity="0.3"/>
  <line x1="50" y1="250" x2="450" y2="250" stroke="#ff0000" stroke-width="1" opacity="0.3"/>
  <line x1="100" y1="100" x2="400" y2="400" stroke="#ff0000" stroke-width="1" opacity="0.3"/>
  <line x1="100" y1="400" x2="400" y2="100" stroke="#ff0000" stroke-width="1" opacity="0.3"/>
  
  <!-- Spider Body - Main -->
  <ellipse cx="250" cy="230" rx="45" ry="55" fill="#cc0000"/>
  <ellipse cx="250" cy="280" rx="35" ry="45" fill="#990000"/>
  
  <!-- Spider Head -->
  <circle cx="250" cy="190" r="25" fill="#aa0000"/>
  
  <!-- Eyes -->
  <circle cx="240" cy="185" r="5" fill="#ff0000"/>
  <circle cx="260" cy="185" r="5" fill="#ff0000"/>
  <circle cx="240" cy="185" r="2" fill="#ffffff"/>
  <circle cx="260" cy="185" r="2" fill="#ffffff"/>
  
  <!-- Fangs -->
  <path d="M 245 200 L 243 210 L 247 210 Z" fill="#ffffff"/>
  <path d="M 255 200 L 253 210 L 257 210 Z" fill="#ffffff"/>
  
  <!-- Legs - Left Side -->
  <path d="M 205 220 Q 150 200 120 180" stroke="#cc0000" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M 210 240 Q 140 240 100 250" stroke="#cc0000" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M 215 260 Q 150 280 120 320" stroke="#cc0000" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M 220 280 Q 160 310 130 350" stroke="#cc0000" stroke-width="6" fill="none" stroke-linecap="round"/>
  
  <!-- Legs - Right Side -->
  <path d="M 295 220 Q 350 200 380 180" stroke="#cc0000" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M 290 240 Q 360 240 400 250" stroke="#cc0000" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M 285 260 Q 350 280 380 320" stroke="#cc0000" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M 280 280 Q 340 310 370 350" stroke="#cc0000" stroke-width="6" fill="none" stroke-linecap="round"/>
  
  <!-- Text -->
  <text x="250" y="420" font-family="monospace" font-size="32" fill="#ff0000" text-anchor="middle" font-weight="bold">SUPER NS</text>
  <text x="250" y="450" font-family="monospace" font-size="16" fill="#ff3333" text-anchor="middle">by L'Araignée</text>
  
  <!-- Glow effect -->
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <circle cx="250" cy="230" r="70" fill="none" stroke="#ff0000" stroke-width="2" opacity="0.3" filter="url(#glow)"/>
</svg>
